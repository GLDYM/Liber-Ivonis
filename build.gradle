plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id
base { archivesName = 'liber-ivonis' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_forge_version
    parchment { minecraftVersion = '1.21.1'; mappingsVersion = '2024.11.17' }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data { data(); programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath() }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}

repositories {
    mavenCentral()
    maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases' }
    maven { name = 'Parchment'; url = 'https://maven.parchmentmc.org' }
    maven { name = 'Architectury'; url = 'https://maven.architectury.dev' }
    maven { name = 'CurseMaven'; url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { name = 'Patchouli'; url = 'https://maven.blamejared.com' }
}

dependencies {
    // ModernUI Arc3D is a required frontend dependency.
    implementation 'curse.maven:modern-ui-352491:8206075'
    // Local API reference supplied for the ModernUI 3.13.0.1 implementation.
    compileOnly files('libs/ModernUI-NeoForge-1.21.1-3.13.0.1-universal.jar')
    implementation 'curse.maven:ageratum-1500610:8575846'

    // Optional integrations used by the Hub during development/runtime.
    implementation 'curse.maven:ftb-quests-forge-289412:8730556'
    implementation 'curse.maven:ftb-library-forge-404465:8569579'
    implementation 'curse.maven:ftb-teams-forge-404468:7878281'
    implementation 'curse.maven:architectury-api-419699:8492726'
    implementation 'vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE'
    implementation 'curse.maven:modonomicon-538392:8532346'
    implementation 'org.appliedenergistics:guideme:21.1.15'
}

tasks.named('processResources', ProcessResources).configure {
    def props = [minecraft_version_range:minecraft_version_range, neo_forge_version:neo_forge_version,
                 neoforge_version_range:neoforge_version_range, loader_version_range:loader_version_range,
                 mod_id:mod_id, mod_name:mod_name, mod_license:mod_license, mod_version:mod_version,
                 mod_authors:mod_authors, mod_description:mod_description]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

publishing { publications { register('mavenJava', MavenPublication) { from components.java } } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
